<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Classe Z.08</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap">
    <style>
        :root {
            --bg: #fff;
            --ink: #111827;
            --mu: #6B7280;
            --ln: #E5E7EB;
            --ac: #1F3A93;
            --ok: #1B7F48;
            --okb: #EAF6EF;
            --ko: #B8322A;
            --kob: #FCEEEC;
            color-scheme: light;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0F1420;
                --ink: #E8EBF2;
                --mu: #8D97AB;
                --ln: #252E42;
                --ac: #8FA8FF;
                --ok: #4CC083;
                --okb: #12301F;
                --ko: #F0776F;
                --kob: #3A1A18;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #0F1420;
            --ink: #E8EBF2;
            --mu: #8D97AB;
            --ln: #252E42;
            --ac: #8FA8FF;
            --ok: #4CC083;
            --okb: #12301F;
            --ko: #F0776F;
            --kob: #3A1A18;
            color-scheme: dark
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 400 17px/1.55 Barlow, system-ui, sans-serif
        }

        main {
            max-width: 640px;
            margin: 0 auto;
            padding: 64px 20px 64px
        }

        .clock {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 5;
            background: var(--bg);
            border-left: 1px solid var(--ln);
            border-bottom: 1px solid var(--ln);
            border-bottom-left-radius: 8px;
            padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 8px;
            font-size: 14px;
            font-variant-numeric: tabular-nums
        }

        h1,
        h2,
        h3 {
            font-family: Barlow, system-ui, sans-serif;
            margin: 0;
            line-height: 1.25;
            font-weight: 600
        }

        h1 {
            font-size: 34px;
            letter-spacing: -.01em
        }

        h2 {
            font-size: 24px
        }

        h3 {
            font-size: 18px
        }

        p {
            margin: 6px 0
        }

        .mu {
            color: var(--mu);
            font-size: 15px
        }

        button {
            font: inherit;
            cursor: pointer;
            border: 0;
            color: inherit;
            background: none
        }

        button:focus-visible {
            outline: 2px solid var(--ac);
            outline-offset: 2px
        }

        button[disabled] {
            opacity: .45;
            cursor: default
        }

        .btn {
            background: var(--ink);
            color: var(--bg);
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 6px
        }

        .btn.alt {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--ln)
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 22px 0 8px
        }

        .bar {
            height: 3px;
            background: var(--ln);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 6px
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            width: 0;
            transition: width .4s
        }

        .card {
            padding: 18px 0;
            border-bottom: 1px solid var(--ln)
        }

        .card .t {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px
        }

        .card button.btn {
            margin-top: 12px;
            padding: 7px 14px;
            font-size: 15px
        }

        .opt {
            display: block;
            width: 100%;
            text-align: left;
            border: 1px solid var(--ln);
            border-radius: 6px;
            padding: 12px 14px;
            margin: 8px 0
        }

        .opt:hover:not([disabled]) {
            border-color: var(--ac)
        }

        .opt.ok {
            border-color: var(--ok);
            background: var(--okb)
        }

        .opt.ko {
            border-color: var(--ko);
            background: var(--kob)
        }

        .fb {
            border-radius: 6px;
            padding: 12px 14px;
            margin: 16px 0
        }

        .fb.ok {
            background: var(--okb)
        }

        .fb.ko {
            background: var(--kob)
        }

        .miss {
            border-top: 1px solid var(--ln);
            padding: 14px 0
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px
        }

        .tag {
            font-size: 14px;
            color: var(--ko);
            font-weight: 500
        }

        @media (prefers-reduced-motion:reduce) {
            * {
                transition: none !important
            }
        }
    </style>
</head>

<body>
    <div class="clock" id="clk"></div>
    <main id="app"></main>
    <script>
        var C = { g: ["Techniques de gardiennage", "Consentement, pas de violence, la police est la seule autorité judiciaire."], e: ["Esquive et légitime défense", "5 conditions : personne visée, illégitime, grave et actuelle, immédiate, proportionnée."], c: ["Culture et éthique", "Même loi pour tous · oignon · TOPOI · modèle de Cooper."], m: ["Communication, plaintes, radio", "Non verbal ≈ 93 % · écouter d’abord · Roger = compris."], r: ["Situations de crise", "Avertissement ≠ alarme · l’agent applique, il ne décide pas."], i: ["Incendie", "Triangle du feu · CO · flash-over ≠ backdraft · viser la base des flammes."], s: ["Droit social et CP 317", "Contrat = travail + salaire + autorité · CP 317 · CPPT dès 50."] };

            ["g", "Dans quel cas un agent peut-il retenir une personne ?", "Flagrant délit, le temps d’appeler la police, sans violence", "Dès qu’elle est suspectée de vol", "Quand elle refuse un contrôle", "Quand elle n’a pas ses documents", "Rétention = cas exceptionnel : flagrant délit uniquement, sans violence ni fouille approfondie. La police est la seule autorité judiciaire."],
            ["g", "Lors d’un contrôle de véhicule, où se place l’agent ?", "Sur le côté du véhicule", "Devant le véhicule", "Derrière le véhicule", "À l’intérieur de l’habitacle", "Jamais devant ni derrière. Moteur coupé, contact visuel et verbal avec le conducteur, distance de sécurité."],
            ["g", "Vous découvrez un objet suspect dans un coffre. Que faites-vous ?", "Je n’y touche pas, je referme et j’appelle les forces de l’ordre", "Je l’ouvre pour vérifier", "Je le déplace hors du véhicule", "Je demande au conducteur de l’expliquer en le manipulant", "Objet suspect = on n’y touche pas (risque d’engin explosif improvisé). En cas de danger, on referme immédiatement."],
            ["g", "Quel est le rôle du détecteur de métaux ?", "Compléter le contrôle manuel, sans remplacer l’observation", "Remplacer la palpation", "Prouver qu’une personne est coupable", "Détecter tous les objets dangereux", "Il détecte de petites quantités de métal. Un signal = contrôle renforcé."],

            ["e", "Laquelle de ces situations est de la légitime défense ?", "Repousser un coup de poing en cours par un coup de poing", "Se relever et frapper après la fin de l’attaque", "Frapper quelqu’un qui attaque son chien", "Résister à un policier qui arrête quelqu’un légalement", "Il faut une attaque contre une personne, illégitime, grave et actuelle, avec une défense immédiate et proportionnée. Après coup = vengeance."],
            ["e", "Il manque une seule des 5 conditions. Que devient la légitime défense ?", "Elle n’existe plus", "Elle est simplement atténuée", "Elle reste valable si l’agent est en service", "Le juge tranche toujours en faveur de l’agent", "Les 5 conditions sont cumulatives : une seule manquante suffit à l’écarter."],

            ["e", "Dans quels cas la loi présume-t-elle la légitime défense ?", "Escalade de nuit dans une maison habitée ; vol avec violence contre une personne", "Vol à l’étalage ; dispute verbale", "Insultes ; bagarre entre deux personnes", "Toute intrusion de jour dans un magasin", "Ce sont les 2 présomptions légales."],
            ["c", "Quel niveau est le cœur du diagramme en oignon ?", "Les valeurs", "Les symboles", "Les rituels", "Les héros et mythes", "Symboles (visibles) → héros → rituels → valeurs (invisibles, les plus difficiles à changer)."],

            ["m", "Lequel est un parasite INTERNE ?", "Le stress ou la fatigue", "Le bruit ambiant", "Un réseau téléphonique défaillant", "Un environnement bruyant", "Internes : émotions, stress, fatigue, culture. Externes : bruit, problèmes techniques."],

            var e = errs().length, h = '<h1>Classe Z.08</h1><p class="mu">Réponds, lis l’explication, et les questions ratées reviennent pour que tu les retiennes.</p>';
            h += '<p><b>Maîtrise globale : ' + mast() + ' %</b></p><div class="bar"><i style="width:' + mast() + '%"></i></div>';
            h += '<div class="row"><button class="btn" onclick="go(\'x\')">Examen blanc (20 questions)</button><button class="btn alt" onclick="bilan()">Bilan</button><button class="btn alt" onclick="go(\'err\')"' + (e ? '' : ' disabled') + '>Mes erreurs (' + e + ')</button></div>';
            for (var k in C) { h += '<div class="card"><div class="t"><h3>' + C[k][0] + '</h3><span class="mu">' + nl(k) + '</span></div><p class="mu">' + C[k][1] + '</p><div class="bar"><i style="width:' + mast(k) + '%"></i></div><button class="btn" onclick="go(\'' + k + '\')">S’entraîner</button></div>' }
            h += '<p><button class="btn alt" onclick="if(confirm(\'Effacer toute ta progression ?\')){S={};save();home()}">Réinitialiser</button></p>';
            A.innerHTML = h; window.scrollTo(0, 0)
        }
        function go(m) {
            var l = m == "x" ? sh(ids()).slice(0, 20) : m == "err" ? errs() : ids(m); if (!l.length) return;
            se = { q: sh(l), n: l.length, f: 0, ok: 0, miss: [], re: {}, m: m }; nxt()
        }
        function nxt() {
            if (!se.q.length) return res();
            var i = se.q[0], q = Q[i], o = sh([2, 3, 4, 5]), h = '<div class="top"><button class="btn alt" onclick="home()">← Accueil</button><span class="mu">' + se.f + ' / ' + se.n + ' réussies ou vues</span></div><div class="bar"><i style="width:' + 100 * se.f / se.n + '%"></i></div>';
            h += (se.re[i] ? '<p class="tag">À revoir : tu t’es trompé sur celle-ci</p>' : '<p class="mu">' + C[q[0]][0] + '</p>') + '<h2>' + q[1] + '</h2><div id="o">';
            o.forEach(function (x, n) { h += '<button class="opt" onclick="ans(' + n + ',' + x + ')">' + q[x] + '</button>' });
            A.innerHTML = h + '</div><div id="fb"></div>'; se.o = o; window.scrollTo(0, 0)
        }
        function ans(n, x) {
            var i = se.q.shift(), q = Q[i], ok = x == 2, b = document.querySelectorAll(".opt"), s = st(i);
            b.forEach(function (e, m) { e.disabled = true; if (se.o[m] == 2) e.classList.add("ok"); else if (m == n) e.classList.add("ko") });
            if (!se.re[i]) s.l = ok ? 1 : 0; if (ok) { s.s++; if (!se.re[i]) { se.ok++ } se.f++ } else { s.s = 0; s.k++; se.re[i] = 1; if (se.miss.indexOf(i) < 0) se.miss.push(i); se.q.splice(Math.min(3, se.q.length), 0, i) }
            save();
            document.getElementById("fb").innerHTML = '<div class="fb ' + (ok ? 'ok' : 'ko') + '"><b>' + (ok ? 'Correct.' : 'Pas tout à fait.') + '</b>' + (ok ? '' : '<p>Bonne réponse : <b>' + q[2] + '</b></p>') + '<p>' + q[6] + '</p></div><button class="btn" id="nx" onclick="nxt()">Suivant</button>';
            document.getElementById("nx").focus()
        }
        function res() {
            var p = Math.round(100 * se.ok / se.n), h = '<h1>' + se.ok + ' / ' + se.n + ' du premier coup</h1><p>' + (p >= 80 ? 'Très solide. Passe aux autres chapitres.' : p >= 50 ? 'Bon début. Relis les explications ci-dessous.' : 'Normal : c’est en se trompant qu’on retient. Relis, puis refais la série.') + '</p>';
            if (se.miss.length) { h += '<h2>À retenir</h2>'; se.miss.forEach(function (i) { var q = Q[i]; h += '<div class="miss"><b>' + q[1] + '</b><p>✔ ' + q[2] + '</p><p class="mu">' + q[6] + '</p></div>' }) }
            h += '<div class="row"><button class="btn" onclick="go(\'' + se.m + '\')">Refaire</button>';
            if (errs().length) h += '<button class="btn alt" onclick="go(\'err\')">Mes erreurs (' + errs().length + ')</button>';
            A.innerHTML = h + '<button class="btn alt" onclick="home()">Accueil</button></div>'; window.scrollTo(0, 0)
        }
        function tick() {
            var t = new Date(2026, 9, 23, 12, 30, 0) - new Date(), e = document.getElementById('clk');
            if (t <= 0) { e.textContent = 'Examen en cours ou terminé'; return }
            var d = Math.floor(t / 864e5), h = Math.floor(t % 864e5 / 36e5), m = Math.floor(t % 36e5 / 6e4), s = Math.floor(t % 6e4 / 1e3), p = function (n) { return String(n).padStart(2, '0') };
            e.innerHTML = '<span class="mu">Examen 12 h 30 · </span><b>' + (d ? d + ' j ' : '') + p(h) + ':' + p(m) + ':' + p(s) + '</b>'
        }
        tick(); setInterval(tick, 1000);
        home();
    </script>
