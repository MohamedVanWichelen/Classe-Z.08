<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Classe Z.08</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap">
    <style>
        :root {
            --bg: #fff;
            --ink: #111827;
            --mu: #6B7280;
            --ln: #E5E7EB;
            --ac: #1F3A93;
            --ok: #1B7F48;
            --okb: #EAF6EF;
            --ko: #B8322A;
            --kob: #FCEEEC;
            color-scheme: light;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0F1420;
                --ink: #E8EBF2;
                --mu: #8D97AB;
                --ln: #252E42;
                --ac: #8FA8FF;
                --ok: #4CC083;
                --okb: #12301F;
                --ko: #F0776F;
                --kob: #3A1A18;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #0F1420;
            --ink: #E8EBF2;
            --mu: #8D97AB;
            --ln: #252E42;
            --ac: #8FA8FF;
            --ok: #4CC083;
            --okb: #12301F;
            --ko: #F0776F;
            --kob: #3A1A18;
            color-scheme: dark
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 400 17px/1.55 Barlow, system-ui, sans-serif
        }

        main {
            max-width: 640px;
            margin: 0 auto;
            padding: 64px 20px 64px
        }

        .clock {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 5;
            background: var(--bg);
            border-left: 1px solid var(--ln);
            border-bottom: 1px solid var(--ln);
            border-bottom-left-radius: 8px;
            padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 8px;
            font-size: 14px;
            font-variant-numeric: tabular-nums
        }

        h1,
        h2,
        h3 {
            font-family: Barlow, system-ui, sans-serif;
            margin: 0;
            line-height: 1.25;
            font-weight: 600
        }

        h1 {
            font-size: 34px;
            letter-spacing: -.01em
        }

        h2 {
            font-size: 24px
        }

        h3 {
            font-size: 18px
        }

        p {
            margin: 6px 0
        }

        .mu {
            color: var(--mu);
            font-size: 15px
        }

        button {
            font: inherit;
            cursor: pointer;
            border: 0;
            color: inherit;
            background: none
        }

        button:focus-visible {
            outline: 2px solid var(--ac);
            outline-offset: 2px
        }

        button[disabled] {
            opacity: .45;
            cursor: default
        }

        .btn {
            background: var(--ink);
            color: var(--bg);
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 6px
        }

        .btn.alt {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--ln)
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 22px 0 8px
        }

        .bar {
            height: 3px;
            background: var(--ln);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 6px
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            width: 0;
            transition: width .4s
        }

        .card {
            padding: 18px 0;
            border-bottom: 1px solid var(--ln)
        }

        .card .t {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px
        }

        .card button.btn {
            margin-top: 12px;
            padding: 7px 14px;
            font-size: 15px
        }

        .opt {
            display: block;
            width: 100%;
            text-align: left;
            border: 1px solid var(--ln);
            border-radius: 6px;
            padding: 12px 14px;
            margin: 8px 0
        }

        .opt:hover:not([disabled]) {
            border-color: var(--ac)
        }

        .opt.ok {
            border-color: var(--ok);
            background: var(--okb)
        }

        .opt.ko {
            border-color: var(--ko);
            background: var(--kob)
        }

        .fb {
            border-radius: 6px;
            padding: 12px 14px;
            margin: 16px 0
        }

        .fb.ok {
            background: var(--okb)
        }

        .fb.ko {
            background: var(--kob)
        }

        .miss {
            border-top: 1px solid var(--ln);
            padding: 14px 0
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px
        }

        .tag {
            font-size: 14px;
            color: var(--ko);
            font-weight: 500
        }

        @media (prefers-reduced-motion:reduce) {
            * {
                transition: none !important
            }
        }
    </style>
</head>

<body>
    <div class="clock" id="clk"></div>
    <main id="app"></main>
    <script>

            ["g", "Dans quel cas un agent peut-il retenir une personne ?", "Flagrant délit, le temps d’appeler la police, sans violence", "Dès qu’elle est suspectée de vol", "Quand elle refuse un contrôle", "Quand elle n’a pas ses documents", "Rétention = cas exceptionnel : flagrant délit uniquement, sans violence ni fouille approfondie. La police est la seule autorité judiciaire."],
            ["g", "Lors d’un contrôle de véhicule, où se place l’agent ?", "Sur le côté du véhicule", "Devant le véhicule", "Derrière le véhicule", "À l’intérieur de l’habitacle", "Jamais devant ni derrière. Moteur coupé, contact visuel et verbal avec le conducteur, distance de sécurité."],
            ["g", "Vous découvrez un objet suspect dans un coffre. Que faites-vous ?", "Je n’y touche pas, je referme et j’appelle les forces de l’ordre", "Je l’ouvre pour vérifier", "Je le déplace hors du véhicule", "Je demande au conducteur de l’expliquer en le manipulant", "Objet suspect = on n’y touche pas (risque d’engin explosif improvisé). En cas de danger, on referme immédiatement."],
            ["g", "Quel est le rôle du détecteur de métaux ?", "Compléter le contrôle manuel, sans remplacer l’observation", "Remplacer la palpation", "Prouver qu’une personne est coupable", "Détecter tous les objets dangereux", "Il détecte de petites quantités de métal. Un signal = contrôle renforcé."],

            ["e", "Laquelle de ces situations est de la légitime défense ?", "Repousser un coup de poing en cours par un coup de poing", "Se relever et frapper après la fin de l’attaque", "Frapper quelqu’un qui attaque son chien", "Résister à un policier qui arrête quelqu’un légalement", "Il faut une attaque contre une personne, illégitime, grave et actuelle, avec une défense immédiate et proportionnée. Après coup = vengeance."],
